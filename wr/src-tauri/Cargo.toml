[package]
name = "widgets"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
windows = { version = "0.58", features = ["Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
